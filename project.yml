name: GuitarTransposer
options:
  bundleIdPrefix: com.norhther.guitartransposer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    DEVELOPMENT_TEAM: 327GNX96WY
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    TARGETED_DEVICE_FAMILY: "2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Xcode 16+ Debug builds otherwise ship a blank launcher stub as the bundle
    # executable and move real code to <Target>.debug.dylib. AUv3 hosts resolve
    # the component through the on-disk bundle executable, so the stub breaks
    # bundle-derived lookups (display name, icon) while audio still works.
    ENABLE_DEBUG_DYLIB: "NO"
schemes:
  TransposerApp:
    build:
      targets:
        TransposerApp: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  TransposerApp:
    type: application
    platform: iOS
    sources:
      - path: TransposerApp
      - path: Shared
      - path: TransposerExtension/TransposerAudioUnit.swift
      - path: TransposerExtension/DSP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.norhther.guitartransposer
        INFOPLIST_FILE: TransposerApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: TransposerApp/TransposerApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Development"
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_OBJC_BRIDGING_HEADER: TransposerExtension/TransposerExtension-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/signalsmith-stretch"
          - "$(SRCROOT)/Vendor/signalsmith-linear/.."
    dependencies:
      - target: TransposerExtension
        embed: true
  TransposerExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TransposerExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.norhther.guitartransposer.aufx
        INFOPLIST_FILE: TransposerExtension/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: TransposerExtension/TransposerExtension-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "2"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/signalsmith-stretch"
          - "$(SRCROOT)/Vendor/signalsmith-linear/.."
